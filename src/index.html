<!doctype html>
<html lang="es"><meta charset="utf-8"><title>Mandarina</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:rgba(0,0,0,0.005);
    font:600 13px "Segoe UI Variable","Segoe UI",system-ui,sans-serif;user-select:none;cursor:default}
  #menu{position:absolute;width:300px;height:300px;margin:-150px 0 0 -150px;display:none;pointer-events:none}
  svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 10px 30px rgba(0,0,0,.5))}
  .seg{fill:rgba(26,22,20,.94);stroke:rgba(255,255,255,.14);stroke-width:1;transition:fill .1s ease,stroke .1s ease,filter .1s ease}
  .seg.on{fill:#ff8a1f;stroke:#ffffff;stroke-width:2;filter:drop-shadow(0 0 16px rgba(255,138,31,.9))}
  text{fill:#ffffff;text-anchor:middle;dominant-baseline:central;font-size:13px;font-weight:600;letter-spacing:.3px;transition:all .1s ease}
  #hub{fill:rgba(20,16,14,.96);stroke:rgba(255,255,255,.15);stroke-width:1}
  #name{font-size:11px;font-weight:600;fill:#f0e4d6}
  #sub{font-size:11px;font-weight:700;fill:#ff8a1f}
  .on-t{fill:#14100e;font-weight:800;font-size:15px}
</style>
<div id="menu"><svg viewBox="-150 -150 300 300" id="svg"></svg></div>
<script>
const { invoke } = window.__TAURI__.core;
const win = window.__TAURI__.webviewWindow.getCurrentWebviewWindow();
const log = m => invoke('log_js', { msg: String(m) }).catch(() => {});
addEventListener('error', e => log('error: ' + e.message));
log('interfaz mandarina iniciada');

const R0 = 56, R1 = 140, menu = document.getElementById('menu'), svg = document.getElementById('svg');
let paths = [], fmts = [], cx = 0, cy = 0, sel = -1;

const pt = (r, a) => [r * Math.cos(a), r * Math.sin(a)];
function seg(a0, a1) {
  const [x0, y0] = pt(R1, a0), [x1, y1] = pt(R1, a1), [x2, y2] = pt(R0, a1), [x3, y3] = pt(R0, a0);
  return `M${x0},${y0}A${R1},${R1} 0 0 1 ${x1},${y1}L${x2},${y2}A${R0},${R0} 0 0 0 ${x3},${y3}Z`;
}
function build(name) {
  const n = fmts.length, step = 2 * Math.PI / n, g = 0.03;
  svg.innerHTML = fmts.map((f, i) => {
    const a0 = -Math.PI / 2 + i * step + g, a1 = a0 + step - 2 * g, [tx, ty] = pt((R0 + R1) / 2, (a0 + a1) / 2);
    return `<path class="seg" id="s${i}" d="${seg(a0, a1)}"/><text id="t${i}" x="${tx}" y="${ty}">${f.toUpperCase()}</text>`;
  }).join('') + `
    <circle id="hub" r="${R0 - 8}"/>
    <text id="name" y="-9">${name}</text>
    <text id="sub" y="11">Elige formato</text>
  `;
}
function hit(x, y) {
  const dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy);
  if (d < R0 || d > R1 + 60) return -1;
  const a = (Math.atan2(dy, dx) + Math.PI / 2 + 2 * Math.PI) % (2 * Math.PI);
  return Math.floor(a / (2 * Math.PI / fmts.length));
}
function mark(i) {
  if (i === sel) return;
  if (sel >= 0) {
    const sEl = s(sel), tEl = t(sel);
    if (sEl) sEl.classList.remove('on');
    if (tEl) tEl.classList.remove('on-t');
  }
  if (i >= 0 && i < fmts.length) {
    const sEl = s(i), tEl = t(i);
    if (sEl) sEl.classList.add('on');
    if (tEl) tEl.classList.add('on-t');
    const sub = document.getElementById('sub');
    if (sub) sub.textContent = '➔ .' + fmts[i].toUpperCase();
  } else {
    const sub = document.getElementById('sub');
    if (sub) sub.textContent = 'Elige formato';
  }
  sel = i;
}
const s = i => document.getElementById('s' + i), t = i => document.getElementById('t' + i);
const css = p => [p.x / devicePixelRatio, p.y / devicePixelRatio];

// Apertura del radial al detectar arrastre
win.listen('open_radial', async ({ payload: p }) => {
  log('open_radial: ' + (p.paths || []).join('|'));
  paths = p.paths; sel = -1;
  fmts = await invoke('formats_for', { path: paths[0] });
  if (!fmts.length) return;
  const [x, y] = css({ x: p.x, y: p.y });
  cx = Math.min(Math.max(x, 170), innerWidth - 170); cy = Math.min(Math.max(y, 170), innerHeight - 170);
  menu.style.left = cx + 'px'; menu.style.top = cy + 'px';
  build(paths[0].split(/[\\/]/).pop().slice(0, 14));
  menu.style.display = 'block';
});

// Actualización en tiempo real del cursor desde el watcher nativo de Rust
win.listen('cursor_move', ({ payload: p }) => {
  if (fmts.length && menu.style.display === 'block') {
    const [x, y] = css(p);
    mark(hit(x, y));
  }
});

// Conversión al soltar el botón izquierdo
win.listen('mouse_up', () => {
  const i = fmts.length ? sel : -1;
  menu.style.display = 'none';
  if (i >= 0 && paths.length) {
    log('convirtiendo ' + paths[0] + ' a ' + fmts[i]);
    invoke('convert', { paths, target: fmts[i] }).catch(e => console.error(e));
  }
});

// Eventos del DOM estándar
window.addEventListener('mousemove', e => {
  if (fmts.length && menu.style.display === 'block') {
    mark(hit(e.clientX, e.clientY));
  }
});

// Manejo OLE HTML5 para responder dropEffect = copy y eliminar el cursor de prohibido
const acceptDrag = e => {
  e.preventDefault();
  if (e.dataTransfer) {
    e.dataTransfer.dropEffect = 'copy';
    e.dataTransfer.effectAllowed = 'all';
  }
  if (fmts.length && menu.style.display === 'block') {
    mark(hit(e.clientX, e.clientY));
  }
};
document.addEventListener('dragenter', acceptDrag);
document.addEventListener('dragover', acceptDrag);
window.addEventListener('dragenter', acceptDrag);
window.addEventListener('dragover', acceptDrag);
document.addEventListener('drop', e => {
  e.preventDefault();
  const i = fmts.length ? sel : -1;
  menu.style.display = 'none';
  if (i >= 0 && paths.length) {
    invoke('convert', { paths, target: fmts[i] }).catch(err => console.error(err));
  }
});
</script>
</html>
