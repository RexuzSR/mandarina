<!doctype html>
<html lang="es"><meta charset="utf-8"><title>Mandarina – Progreso</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;overflow:hidden;
    background:transparent;
    font-family:'Inter','Segoe UI Variable','Segoe UI',system-ui,sans-serif;
    user-select:none;cursor:default;
  }

  #toast{
    position:absolute;bottom:12px;right:12px;left:12px;
    background:rgba(22,18,16,.92);
    backdrop-filter:blur(24px) saturate(1.6);
    -webkit-backdrop-filter:blur(24px) saturate(1.6);
    border:1px solid rgba(255,255,255,.1);
    border-radius:14px;
    padding:16px 18px 14px;
    box-shadow:0 8px 32px rgba(0,0,0,.55), 0 0 0 1px rgba(255,138,31,.08);
    opacity:0;
    transform:translateY(20px) scale(.96);
    transition:opacity .35s cubic-bezier(.4,0,.2,1), transform .35s cubic-bezier(.4,0,.2,1);
  }
  #toast.show{
    opacity:1;
    transform:translateY(0) scale(1);
  }
  #toast.hide{
    opacity:0;
    transform:translateY(20px) scale(.96);
  }

  .header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:10px;
  }
  .icon{font-size:16px;margin-right:8px;line-height:1}
  .title{
    display:flex;align-items:center;
    font-size:12.5px;font-weight:600;color:#f0e4d6;
    letter-spacing:.2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    flex:1;
  }
  .percent{
    font-size:13px;font-weight:700;color:#ff8a1f;
    min-width:38px;text-align:right;
    font-variant-numeric:tabular-nums;
  }

  .bar-track{
    width:100%;height:6px;
    background:rgba(255,255,255,.08);
    border-radius:3px;
    overflow:hidden;
    position:relative;
  }
  .bar-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg,#ff8a1f 0%,#ffb84d 60%,#ffe0a3 100%);
    border-radius:3px;
    transition:width .25s cubic-bezier(.4,0,.2,1);
    position:relative;
  }
  .bar-fill::after{
    content:'';position:absolute;
    top:0;right:0;bottom:0;left:0;
    background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.25) 50%,transparent 100%);
    animation:shimmer 1.5s infinite;
  }
  @keyframes shimmer{
    0%{transform:translateX(-100%)}
    100%{transform:translateX(100%)}
  }

  .status{
    margin-top:8px;
    font-size:11px;font-weight:500;
    color:rgba(240,228,214,.5);
    letter-spacing:.15px;
  }

  /* Success state */
  #toast.done .bar-fill{
    background:linear-gradient(90deg,#34d399,#6ee7b7);
  }
  #toast.done .bar-fill::after{
    animation:none;
  }
  #toast.done .percent{color:#34d399}
  #toast.done .status{color:rgba(52,211,153,.7)}

  /* Error state */
  #toast.error .bar-fill{
    background:linear-gradient(90deg,#f87171,#fca5a5);
  }
  #toast.error .bar-fill::after{animation:none}
  #toast.error .percent{color:#f87171}
  #toast.error .status{color:rgba(248,113,113,.7)}
</style>

<div id="toast">
  <div class="header">
    <span class="title">
      <span class="icon">🍊</span>
      <span id="filename">Convirtiendo...</span>
    </span>
    <span class="percent" id="percent">0%</span>
  </div>
  <div class="bar-track">
    <div class="bar-fill" id="bar"></div>
  </div>
  <div class="status" id="status">Convirtiendo archivo...</div>
</div>

<script>
const win = window.__TAURI__.webviewWindow.getCurrentWebviewWindow();

const toast    = document.getElementById('toast');
const filename = document.getElementById('filename');
const percent  = document.getElementById('percent');
const bar      = document.getElementById('bar');
const status   = document.getElementById('status');

let hideTimer = null;

// { file: "photo.png", target: "jpg", current: 1, total: 3 }
win.listen('progress_start', ({ payload: p }) => {
  clearTimeout(hideTimer);
  toast.className = 'show';
  const name = p.file || 'archivo';
  const tgt  = (p.target || '').toUpperCase();
  if (p.total > 1) {
    filename.textContent = `${name}  ➜  .${tgt}  (${p.current}/${p.total})`;
  } else {
    filename.textContent = `${name}  ➜  .${tgt}`;
  }
  bar.style.width = '0%';
  percent.textContent = '0%';
  status.textContent = 'Convirtiendo archivo...';
});

// number 0-100
win.listen('progress_update', ({ payload: p }) => {
  const v = Math.min(100, Math.max(0, p));
  bar.style.width = v + '%';
  percent.textContent = v + '%';
});

// { success: true, output: "photo.jpg" } or { success: false, error: "..." }
win.listen('progress_done', ({ payload: p }) => {
  bar.style.width = '100%';
  percent.textContent = '100%';
  if (p.success) {
    toast.className = 'show done';
    status.textContent = '✓ Listo';
  } else {
    toast.className = 'show error';
    status.textContent = '✗ Error: ' + (p.error || 'desconocido').slice(0, 80);
  }
  hideTimer = setTimeout(() => {
    toast.className = 'hide';
    setTimeout(() => {
      toast.className = '';
      bar.style.width = '0%';
    }, 400);
  }, p.success ? 2500 : 4000);
});
</script>
</html>
