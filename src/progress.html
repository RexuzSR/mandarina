<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Mandarina – Progreso</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Inter', 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
      user-select: none;
      cursor: default;
    }

    /* Glassmorphism Container */
    #toast {
      position: absolute;
      bottom: 8px; right: 8px; left: 8px; top: 8px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 40%, rgba(15, 23, 42, 0.65) 100%), rgba(10, 16, 31, 0.62);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      padding: 12px 16px 11px;
      box-shadow: 
        0 16px 40px rgba(0, 0, 0, 0.55),
        inset 0 1px 1px 0 rgba(255, 255, 255, 0.35),
        0 0 25px rgba(56, 189, 248, 0.15);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease, opacity 0.3s ease;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .icon {
      font-size: 15px;
      line-height: 1;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
    }
    .title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 600;
      color: #f1f5f9;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }
    .title .target {
      color: #38bdf8;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
    .title .arrow {
      color: #60a5fa;
      font-weight: 600;
      opacity: 0.9;
    }
    .title .counter {
      color: #94a3b8;
      font-size: 11px;
      font-weight: 500;
    }

    /* Blue Gradient Percentage */
    .percent {
      font-size: 13.5px;
      font-weight: 700;
      background: linear-gradient(135deg, #7dd3fc 0%, #38bdf8 50%, #60a5fa 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.45));
      min-width: 40px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      transition: all 0.3s ease;
    }

    /* Blue Gradient Progress Bar */
    .bar-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      margin: 8px 0 6px;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1d4ed8 0%, #2563eb 25%, #0284c7 60%, #38bdf8 95%, #7dd3fc 100%);
      border-radius: 4px;
      transition: width 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.7), 0 0 20px rgba(37, 99, 235, 0.4);
    }
    .bar-fill::after {
      content: '';
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.6) 50%, transparent 100%);
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .status {
      font-size: 11px;
      font-weight: 500;
      color: rgba(203, 213, 225, 0.7);
      letter-spacing: 0.15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    /* Success state (Green Glass Glow) */
    #toast.done {
      border-color: rgba(52, 211, 153, 0.45);
      box-shadow: 
        0 16px 40px rgba(0, 0, 0, 0.55),
        inset 0 1px 1px 0 rgba(255, 255, 255, 0.35),
        0 0 25px rgba(52, 211, 153, 0.25);
    }
    #toast.done .bar-fill {
      background: linear-gradient(90deg, #059669 0%, #10b981 50%, #34d399 100%);
      box-shadow: 0 0 12px rgba(52, 211, 153, 0.75);
    }
    #toast.done .bar-fill::after { display: none; }
    #toast.done .percent {
      background: linear-gradient(135deg, #a7f3d0 0%, #34d399 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 8px rgba(52, 211, 153, 0.5));
    }
    #toast.done .status {
      color: #34d399;
      font-weight: 600;
      text-shadow: 0 0 8px rgba(52, 211, 153, 0.4);
    }

    /* Error state (Red Glass Glow) */
    #toast.error {
      border-color: rgba(248, 113, 113, 0.45);
      box-shadow: 
        0 16px 40px rgba(0, 0, 0, 0.55),
        inset 0 1px 1px 0 rgba(255, 255, 255, 0.35),
        0 0 25px rgba(248, 113, 113, 0.25);
    }
    #toast.error .bar-fill {
      background: linear-gradient(90deg, #dc2626 0%, #ef4444 50%, #f87171 100%);
      box-shadow: 0 0 12px rgba(248, 113, 113, 0.75);
    }
    #toast.error .bar-fill::after { display: none; }
    #toast.error .percent {
      background: linear-gradient(135deg, #fecaca 0%, #f87171 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 8px rgba(248, 113, 113, 0.5));
    }
    #toast.error .status {
      color: #f87171;
      font-weight: 600;
      text-shadow: 0 0 8px rgba(248, 113, 113, 0.4);
    }
  </style>
</head>
<body>
  <div id="toast">
    <div class="header">
      <span class="title" id="titleWrap">
        <span class="icon">🍊</span>
        <span id="filename">Convirtiendo...</span>
      </span>
      <span class="percent" id="percent">0%</span>
    </div>
    <div class="bar-track">
      <div class="bar-fill" id="bar"></div>
    </div>
    <div class="status" id="status">Iniciando conversión...</div>
  </div>

  <script>
    const win = window.__TAURI__.webviewWindow.getCurrentWebviewWindow();
    const toast = document.getElementById('toast');
    const filename = document.getElementById('filename');
    const percent = document.getElementById('percent');
    const bar = document.getElementById('bar');
    const status = document.getElementById('status');

    let currentVal = 0;
    let ticker = null;

    const escapeHtml = str => String(str).replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[m]);

    function setProgress(val) {
      currentVal = Math.max(0, Math.min(100, val));
      bar.style.width = currentVal + '%';
      percent.textContent = Math.round(currentVal) + '%';
    }

    // Tick smoothly while waiting for large conversions
    function startTicker() {
      clearInterval(ticker);
      ticker = setInterval(() => {
        if (currentVal < 88) {
          setProgress(currentVal + (88 - currentVal) * 0.08);
        }
      }, 250);
    }

    win.listen('progress_start', ({ payload: p }) => {
      clearInterval(ticker);
      toast.className = '';
      currentVal = 5;
      setProgress(5);
      const name = escapeHtml(p.file || 'archivo');
      const tgt = escapeHtml((p.target || '').toUpperCase());
      if (p.total > 1) {
        filename.innerHTML = `${name} <span class="arrow">➔</span> <span class="target">.${tgt}</span> <span class="counter">(${p.current}/${p.total})</span>`;
      } else {
        filename.innerHTML = `${name} <span class="arrow">➔</span> <span class="target">.${tgt}</span>`;
      }
      status.textContent = 'Procesando conversión...';
      startTicker();
    });

    win.listen('progress_update', ({ payload: p }) => {
      clearInterval(ticker);
      setProgress(p);
      status.textContent = 'Convirtiendo...';
    });

    win.listen('progress_done', ({ payload: p }) => {
      clearInterval(ticker);
      if (p.success) {
        setProgress(100);
        toast.className = 'done';
        status.textContent = p.output ? `✓ Listo: ${escapeHtml(p.output)}` : '✓ Listo';
      } else {
        toast.className = 'error';
        bar.style.width = '100%';
        percent.textContent = '✗';
        status.textContent = '✗ Error: ' + (p.error || 'falló').slice(0, 70);
      }
    });
  </script>
</body>
</html>
