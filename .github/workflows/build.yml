name: Compilar y publicar Mandarina
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/* }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm install
      - run: npm run build
      - name: Crear versión portable
        shell: pwsh
        run: Compress-Archive -Path src-tauri/target/release/mandarina.exe -DestinationPath Mandarina-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Mandarina-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            Mandarina-portable.zip
      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            Mandarina-portable.zip
          generate_release_notes: true
